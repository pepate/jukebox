<title>Jukebox 3D – Winterveranstaltung</title>
<script>
/* ==================================================================
   PROGRAMM – hier Lieder, Pausen und Abstimmung pflegen.
   Reihenfolge = Ablauf am Abend.
     { typ:'intro', titel, untertitel }
     { typ:'lied',  titel, chor }      oder  { typ:'lied', titel, solist }
     { typ:'text',  titel, text }      (Übergangsseite, z.B. Pause / Danke)
     { typ:'abstimmung', titel, frage, dauer (Sek.), stimmen, ergebnis:[{titel, prozent}] }
   Bedienung: → / Leertaste / Tippen = weiter · ← / linker Rand = zurück
              F = Vollbild · M = Ton an/aus · H = Hilfe
   ================================================================== */
const TEMPO = 1.4;   // Geschwindigkeit der Jukebox-Mechanik (1 = gemütlich, 2 = flott)

const PROGRAMM = [
  { typ: 'intro', titel: 'Herzlich willkommen!', untertitel: 'Winterveranstaltung 2027' },
  { typ: 'lied',  titel: 'Über den Wolken',        chor: 'Gemischter Chor' },
  { typ: 'lied',  titel: 'Griechischer Wein',      chor: "D'A Chor" },
  { typ: 'lied',  titel: 'Moon River',             solist: 'Anna Beispiel' },
  { typ: 'lied',  titel: 'Ein Kompliment',         chor: 'Männerchor' },
  { typ: 'text',  titel: 'Pause', text: 'Gleich geht’s weiter – gönnen Sie sich etwas zu trinken!' },
  { typ: 'lied',  titel: 'Rock Around the Clock',  chor: 'Ried-Sternchen' },
  { typ: 'lied',  titel: 'Hallelujah',             solist: 'Lena & Tom' },
  { typ: 'lied',  titel: 'Atemlos durch die Nacht', chor: 'Frauenchor' },
  { typ: 'lied',  titel: 'Thank You for the Music', chor: 'Alle Chöre' },
  { typ: 'abstimmung', titel: 'Publikums-Voting', frage: 'Ihr Lieblingslied des Abends',
    dauer: 12, stimmen: 214,
    ergebnis: [
      { titel: 'Über den Wolken',       prozent: 19 },
      { titel: 'Griechischer Wein',     prozent: 31 },
      { titel: 'Moon River',            prozent: 14 },
      { titel: 'Rock Around the Clock', prozent: 24 },
      { titel: 'Hallelujah',            prozent: 12 },
    ] },
  { typ: 'text',  titel: 'Vielen Dank!', text: 'Kommen Sie gut nach Hause – bis zum nächsten Jahr!' },
];
</script>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

const $ = s => document.querySelector(s);
const rand = (a, b) => a + Math.random() * (b - a);
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const PI = Math.PI;

/* ---------- songs ---------- */
const LABEL_COLORS = ['#E30A14', '#f2b632', '#2f7de1', '#2fbf71', '#9b51e0', '#ff7a1a', '#17b6b0', '#e84393'];
const SONGS = PROGRAMM.filter(p => p.typ === 'lied');
SONGS.forEach((s, i) => { s.code = 'ABCD'[Math.floor(i / 9)] + (i % 9 + 1); s.color = LABEL_COLORS[i % 8]; s.slot = i % 8; s.nr = i; });

/* ---------- stage scaling ---------- */
const stage = $('#stage');
let stageScale = 1;
function fit() {
  stageScale = Math.min(innerWidth / 1920, innerHeight / 1080);
  stage.style.transform = `translate(-50%,-50%) scale(${stageScale})`;
  if (renderer) {
    const pr = Math.max(.5, Math.min(1.5, devicePixelRatio * stageScale));
    renderer.setPixelRatio(pr); composer.setPixelRatio(pr); bloomComposer.setPixelRatio(pr * .5);
    renderer.setSize(1920, 1080, false); composer.setSize(1920, 1080); bloomComposer.setSize(1920, 1080);
  }
}
let cursorTimer;
addEventListener('mousemove', () => {
  document.body.classList.remove('nocursor');
  clearTimeout(cursorTimer);
  cursorTimer = setTimeout(() => document.body.classList.add('nocursor'), 2000);
});

/* ---------- tweening ---------- */
let HURRY = false;
const E = {
  lin: t => t,
  inOut: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  out: t => 1 - Math.pow(1 - t, 3),
  back: t => { const c = 1.4; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
};
function tween(ms, fn, ease = E.inOut) {
  return new Promise(res => {
    let el = 0, last = performance.now();
    function f(now) {
      el += (now - last) * (HURRY ? 15 : 1); last = now;
      const t = Math.min(1, el / (ms / TEMPO));
      fn(ease(t));
      t < 1 ? requestAnimationFrame(f) : res();
    }
    requestAnimationFrame(f);
  });
}
const wait = ms => tween(ms, () => {}, E.lin);

/* ---------- sound (synthesised) ---------- */
const sfx = {
  ctx: null, on: true,
  init() { if (!this.ctx) try { this.ctx = new AudioContext(); } catch (e) {} },
  ok() { return this.on && this.ctx && !HURRY; },
  noise(dur) {
    const c = this.ctx, b = c.createBuffer(1, Math.max(1, c.sampleRate * dur | 0), c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const s = c.createBufferSource(); s.buffer = b; return s;
  },
  env(peak, a, d) {
    const g = this.ctx.createGain(), t = this.ctx.currentTime;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(.0001, t + a + d);
    g.connect(this.ctx.destination); return g;
  },
  click() {
    if (!this.ok()) return;
    const n = this.noise(.04), f = this.ctx.createBiquadFilter();
    f.type = 'highpass'; f.frequency.value = 1800; n.connect(f); f.connect(this.env(.35, .002, .04)); n.start();
  },
  motor(ms) {
    if (!this.ok() || ms < 120) return;
    const c = this.ctx, d = ms / 1000 / TEMPO, o = c.createOscillator(), f = c.createBiquadFilter(), g = c.createGain(), t = c.currentTime;
    o.type = 'sawtooth'; o.frequency.setValueAtTime(70, t); o.frequency.linearRampToValueAtTime(95, t + d * .5); o.frequency.linearRampToValueAtTime(75, t + d);
    f.type = 'lowpass'; f.frequency.value = 380;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.05, t + .06); g.gain.setValueAtTime(.05, t + d - .08); g.gain.linearRampToValueAtTime(0, t + d);
    o.connect(f); f.connect(g); g.connect(c.destination); o.start(t); o.stop(t + d + .05);
  },
  thunk() {
    if (!this.ok()) return;
    const c = this.ctx, o = c.createOscillator(), t = c.currentTime;
    o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(40, t + .18);
    o.connect(this.env(.45, .005, .22)); o.start(); o.stop(t + .3);
    this.click();
  },
  crackle(sec) {
    if (!this.ok()) return;
    const c = this.ctx, len = c.sampleRate * sec | 0, b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < len; i++) {
      const fade = Math.min(1, i / (c.sampleRate * .3)) * Math.min(1, (len - i) / (c.sampleRate * 1.2));
      d[i] = ((Math.random() * 2 - 1) * .05 + (Math.random() < .0009 ? (Math.random() * 2 - 1) * .9 : 0)) * fade;
    }
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = b; f.type = 'bandpass'; f.frequency.value = 2600; f.Q.value = .6; g.gain.value = .5;
    s.connect(f); f.connect(g); g.connect(c.destination); s.start();
  },
  fanfare() {
    if (!this.ok()) return;
    [523, 659, 784, 1047].forEach((fr, i) => {
      const o = this.ctx.createOscillator(), t = this.ctx.currentTime + i * .12;
      o.type = 'triangle'; o.frequency.value = fr;
      const g = this.ctx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.18, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + .9);
      o.connect(g); g.connect(this.ctx.destination); o.start(t); o.stop(t + 1);
    });
  },
};

/* =====================================================================
   RENDERER, CAMERA, LIGHT
   ===================================================================== */
await Promise.all(['600 100px Oswald', '800 50px Raleway', '100px Yellowtail'].map(f => document.fonts.load(f)));
const logoImg = $('#logoImg');
await Promise.race([new Promise(r => { if (logoImg.complete) r(); else logoImg.onload = logoImg.onerror = r; }), new Promise(r => setTimeout(r, 2000))]);

const renderer = new THREE.WebGLRenderer({ canvas: $('#gl'), antialias: true, powerPreference: 'high-performance' });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = .9;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05060d);
scene.fog = new THREE.Fog(0x05060d, 30, 70);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), .04).texture;

const camera = new THREE.PerspectiveCamera(30, 16 / 9, .1, 200);
// selective bloom: only objects with userData.bloom glow (band, LED, bubbles, notes)
const bloomComposer = new EffectComposer(renderer);
bloomComposer.renderToScreen = false;
bloomComposer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1920, 1080), .5, .18, 0);
bloomComposer.addPass(bloom);
const mixPass = new ShaderPass(new THREE.ShaderMaterial({
  uniforms: { baseTexture: { value: null }, bloomTexture: { value: bloomComposer.renderTarget2.texture } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }',
  fragmentShader: 'uniform sampler2D baseTexture, bloomTexture; varying vec2 vUv; void main(){ gl_FragColor = texture2D(baseTexture, vUv) + texture2D(bloomTexture, vUv); }',
}), 'baseTexture');
mixPass.needsSwap = true;
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(mixPass);
composer.addPass(new OutputPass());
const hiddenForBloom = [];
function renderFrame() {
  scene.traverseVisible(o => { if ((o.isMesh || o.isSprite || o.isPoints) && !o.userData.bloom) { o.visible = false; hiddenForBloom.push(o); } });
  const bg = scene.background; scene.background = null;
  bloomComposer.render();
  scene.background = bg;
  for (const o of hiddenForBloom) o.visible = true;
  hiddenForBloom.length = 0;
  composer.render();
}
addEventListener('resize', fit); fit();

scene.add(new THREE.HemisphereLight(0x8090ff, 0x201010, .35));
const spot = new THREE.SpotLight(0xffe6c4, 250, 60, .5, .7, 2);
spot.position.set(0, 20, 16); spot.target.position.set(0, 4.5, 0);
scene.add(spot, spot.target);
const glowL = new THREE.PointLight(0xff6a3d, 0, 14, 2), glowR = glowL.clone();
glowL.position.set(-8.4, 3, 2.6); glowR.position.set(8.4, 3, 2.6);
const cavLight = new THREE.PointLight(0xffc27a, 0, 7, 2);
cavLight.position.set(.3, 8.9, -.3);
scene.add(glowL, glowR, cavLight);

/* ---------- helpers ---------- */
const maxAniso = renderer.capabilities.getMaxAnisotropy();
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); if (draw) draw(g, w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = maxAniso;
  t.userData.g = g; t.userData.c = c; return t;
}
function bboxUV(geo) {
  geo.computeBoundingBox();
  const b = geo.boundingBox, p = geo.attributes.position, uv = geo.attributes.uv;
  for (let i = 0; i < p.count; i++) uv.setXY(i, (p.getX(i) - b.min.x) / (b.max.x - b.min.x), (p.getY(i) - b.min.y) / (b.max.y - b.min.y));
  uv.needsUpdate = true; return geo;
}
function tube(path, z, r, mat, closed = false) {
  const pts = path.getSpacedPoints(260).map(p => V(p.x, p.y, z));
  if (closed) pts.pop();
  return new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts, closed, 'catmullrom', .05), 520, r, 12, closed), mat);
}
function archPath(rx, ry, cy, y0, P = new THREE.Path()) {
  P.moveTo(-rx, y0); P.lineTo(-rx, cy); P.absellipse(0, cy, rx, ry, PI, 0, true); P.lineTo(rx, y0); return P;
}
function windowPath(P = new THREE.Path()) {
  P.moveTo(-2.28, 5.45); P.lineTo(-2.28, 7.52); P.absarc(0, 7.52, 2.28, PI, 0, true); P.lineTo(2.28, 5.45); P.lineTo(-2.28, 5.45); return P;
}
function rectPath(x0, y0, x1, y1, P = new THREE.Path()) { P.moveTo(x0, y0); P.lineTo(x0, y1); P.lineTo(x1, y1); P.lineTo(x1, y0); P.lineTo(x0, y0); return P; }
const add = (m, x = 0, y = 0, z = 0, parent = scene) => { m.position.set(x, y, z); parent.add(m); return m; };

/* ---------- materials ---------- */
const mChrome = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 1, roughness: .16, envMapIntensity: .75 });
const mChromeDark = new THREE.MeshStandardMaterial({ color: 0x5a6068, metalness: 1, roughness: .35, envMapIntensity: .5 });
const woodTex = canvasTex(1024, 1024, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h);
  gr.addColorStop(0, '#5a2b13'); gr.addColorStop(.5, '#7e421f'); gr.addColorStop(1, '#4a220e');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 260; i++) {
    const y0 = rand(0, h), amp = rand(4, 22), fr = rand(.004, .012), ph = rand(0, 6.28);
    g.strokeStyle = `rgba(${Math.random() < .5 ? '30,12,4' : '150,80,40'},${rand(.05, .22)})`; g.lineWidth = rand(1, 4);

floor.rotation.x = -PI / 2;

function spawnNote() {

/* =====================================================================
   MECHANISM STATE
   ===================================================================== */
const J = { cy: PARK_Y, th: PI / 2, grip: 0, phi: PHI_REST, lift: 0, spinV: 0, held: null, cur: null, playing: 0, power: 0 };
function drawCarriage() {
  carriage.position.y = J.cy;
  armPivot.rotation.y = -J.th;
  clamp.scale.set(1 + J.grip * .25, 1, 1 + J.grip * .25);
  if (J.held) J.held.grp.position.set(PX + ARM_L * Math.cos(J.th), J.cy - REC_OFF, ZC + ARM_L * Math.sin(J.th));
}
function drawTone() { tone.rotation.y = -J.phi; toneArmG.position.y = .1 * J.lift; toneArmG.rotation.z = .05 * J.lift; }
drawCarriage(); drawTone();

async function moveCarriage(toY, toTh, ms, ease = E.inOut) {
  const y0 = J.cy, t0 = J.th;
  if (Math.abs(toY - y0) < .005 && Math.abs(toTh - t0) < .01) return;
  sfx.motor(ms);
  await tween(ms, t => { J.cy = y0 + (toY - y0) * t; J.th = t0 + (toTh - t0) * t; drawCarriage(); }, ease);
}
const vMs = (a, b) => 280 + Math.abs(a - b) * 260;
async function grip(on) { sfx.click(); await tween(160, t => { J.grip = on ? t : 1 - t; drawCarriage(); }); }
async function spinTo(v, ms) { const v0 = J.spinV; await tween(ms, t => J.spinV = v0 + (v - v0) * t); }
async function toneTo(a, ms) { const a0 = J.phi; await tween(ms, t => { J.phi = a0 + (a - a0) * t; drawTone(); }); }
async function liftTo(l, ms) { const l0 = J.lift; await tween(ms, t => { J.lift = l0 + (l - l0) * t; drawTone(); }); }

let camMode = 'home';
const jb = {
  async select(song) {
    for (const l of [song.code[0], song.code.slice(1)]) {
      const b = buttons[l]; b.position.z = .05; sfx.click();
      await wait(260); b.position.z = .1; await wait(120);
    }
    drawLed(song.code);
    drawRacks(song.nr);
  },
  async unload() {
    const r = J.cur;
    if (!r) return;
    this.setPlaying(false);
    sfx.click();
    spinTo(0, 1300);
    await liftTo(1, 250);
    await Promise.all([toneTo(PHI_REST, 650).then(() => liftTo(0, 200)), moveCarriage(PLAT_Y + REC_OFF, 0, 900)]);
    await grip(true);
    J.cur = null; J.held = r; drawCarriage();
    await moveCarriage(SLOT_Y(r.k) + REC_OFF + .04, 0, vMs(PLAT_Y, SLOT_Y(r.k)));
    await moveCarriage(SLOT_Y(r.k) + REC_OFF + .04, PI, 1000);
    await moveCarriage(SLOT_Y(r.k) + REC_OFF, PI, 150);
    await grip(false);
    J.held = null;
    await moveCarriage(SLOT_Y(r.k) + REC_OFF, PI / 2, 380);
  },
  async load(song) {
    const r = recs[song.slot];
    drawLabel(r.lt, song.color, song.code);
    const y = SLOT_Y(r.k) + REC_OFF;
    await moveCarriage(y, PI / 2, vMs(J.cy, y));
    await moveCarriage(y, PI, 450);
    await grip(true);
    J.held = r; drawCarriage();
    await moveCarriage(y + .05, PI, 160);
    await moveCarriage(y + .05, 0, 1100);
    await moveCarriage(PLAT_Y + REC_OFF, 0, vMs(y, PLAT_Y), E.out);
    sfx.thunk();
    await grip(false);
    J.held = null; J.cur = r;
    moveCarriage(PARK_Y, PI / 2, 800);
    spinTo(4.7, 1400);
    await liftTo(1, 200);
    await toneTo(PHI_PLAY, 850);
    await liftTo(0, 350);
    sfx.crackle(4);
    this.setPlaying(true);
  },
  setPlaying(on) { const p0 = J.playing; tween(900, t => J.playing = p0 + ((on ? 1 : 0) - p0) * t); },
  async power() {
    for (const [o, ms] of [[.3, 90], [0, 120], [.9, 80], [.1, 200], [1, 600]]) {
      const o0 = J.power; await tween(ms, t => J.power = o0 + (o - o0) * t, E.lin);
    }
  },
};

/* =====================================================================
   RENDER LOOP (camera eases toward the current shot)
   ===================================================================== */
const camPos = V(0, 7.5, 34), camTgt = V(0, 5.4, 0);
function shot(t) {
  switch (camMode) {
    case 'close': return [V(.9 + Math.sin(t * .3) * 1.1, 7.75 + Math.sin(t * .4) * .15, 7.6), V(-.05, 7.1, -1.2)];
    case 'orbit': { const a = Math.sin(t * .12) * .5; return [V(Math.sin(a) * 23, 7.4 + Math.sin(t * .2) * .6, Math.cos(a) * 23), V(0, 5.4, 0)]; }
    default: return [V(Math.sin(t * .13) * .45, 6.15 + Math.sin(t * .21) * .12, 20.9), V(0, 5.42, 0)];
  }
}
const clock = new THREE.Clock(), bandCol = new THREE.Color(), dummy = new THREE.Object3D();
let noteTimer = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(.05, clock.getDelta()), t = clock.elapsedTime;
  const [p, q] = shot(t), k = 1 - Math.exp(-dt * (HURRY ? 9 : 1.7) * TEMPO);
  camPos.lerp(p, k); camTgt.lerp(q, k);
  camera.position.copy(camPos); camera.lookAt(camTgt);

  bandMat.uniforms.uTime.value = t;
  bandMat.uniforms.uPower.value = J.power;
  bandMat.uniforms.uBoost.value = J.playing * (.5 + .5 * Math.sin(t * 7));
  bandCol.setHSL(((t * .045) % 1) * .12, 1, .55);
  glowL.color.copy(bandCol); glowR.color.copy(bandCol);
  glowL.intensity = glowR.intensity = 5 * J.power;
  cavLight.intensity = (2 + 6 * J.playing) * J.power;
  backWall.material.emissiveIntensity = (.25 + .45 * J.power) * (1 + .5 * J.playing);
  mGrille.emissiveIntensity = .04 + J.playing * (.18 + .14 * Math.sin(t * 7));
  mGlassTube.emissiveIntensity = .25 * J.power + .05;

  if (J.cur && J.spinV) J.cur.grp.rotation.y -= J.spinV * dt;

  bubbleData.forEach((b, i) => {
    b.y += b.v * dt * (.3 + .7 * J.power); if (b.y > 6.95) b.y = .8;
    dummy.position.set(b.x + Math.sin(t * 3 + b.ph) * .03, b.y, .5); dummy.updateMatrix(); bubbles.setMatrixAt(i, dummy.matrix);
  });
  bubbles.instanceMatrix.needsUpdate = true;

  const sp = snowGeo.attributes.position;
  for (let i = 0; i < snowN; i++) {
    let y = sp.getY(i) - snowV[i] * dt; if (y < 0) y = 22;
    sp.setY(i, y); sp.setX(i, sp.getX(i) + Math.sin(t * .5 + i) * .004);
  }
  sp.needsUpdate = true;

  if (J.playing > .9) { noteTimer -= dt; if (noteTimer < 0) { spawnNote(); noteTimer = 1.3; } }
  for (let i = activeNotes.length - 1; i >= 0; i--) {
    const n = activeNotes[i]; n.age += dt;
    n.sp.position.x += n.vx * dt * .5; n.sp.position.y += n.vy * dt; n.sp.material.rotation = Math.sin(n.age * 2) * .3;
    n.sp.material.opacity = Math.min(1, n.age * 3) * Math.max(0, 1 - n.age / n.life);
    if (n.age > n.life) { scene.remove(n.sp); n.sp.material.dispose(); activeNotes.splice(i, 1); }
  }
  renderFrame();
});

const songFace = (s, role) => ({ titel: s.titel, code: s.code, role: role || (s.chor ? 'Chor' : 'Solo'), who: s.chor || s.solist });
function showOverlay(s) {
  const big = $('#overlay .big'); big.textContent = s.titel;
  $('#overlay .sub').textContent = s.text || '';
  big.classList.remove('on'); void big.offsetWidth; big.classList.add('on');
}
function confetti() {
  const cols = ['#ffc65a', '#E30A14', '#4fe3ff', '#ff4f8b', '#fff3e0', '#2fbf71'];
  for (let i = 0; i < 120; i++) {
    const p = document.createElement('div'); p.className = 'confetti';
    const kind = Math.random();
    if (kind < .25) { p.textContent = ['♪', '♫'][i % 2]; p.style.cssText += `font-size:${rand(34, 56)}px;color:${cols[i % 6]};text-shadow:0 0 10px currentColor;font-family:'Segoe UI Symbol'`; }
    else if (kind < .4) { const s = rand(26, 40); p.style.cssText += `width:${s}px;height:${s}px;border-radius:50%;background:radial-gradient(circle,${cols[i % 6]} 0 28%,#111 30% 100%)`; }
    else p.style.cssText += `width:${rand(12, 18)}px;height:${rand(20, 30)}px;background:${cols[i % 6]};border-radius:2px`;
    p.style.left = rand(0, 1920) + 'px'; stage.appendChild(p);
    const dx = rand(-200, 200), rot = rand(-720, 720);
    p.animate([{ transform: 'translate(0,0) rotate(0)' }, { transform: `translate(${dx}px,1200px) rotate(${rot}deg)` }],
      { duration: rand(3000, 5500), delay: rand(0, 900), easing: 'cubic-bezier(.3,.1,.6,1)', fill: 'backwards' }).onfinish = () => p.remove();
  }
}

async function playSong(s, role) {
  camMode = 'close';
  await Promise.all([jb.select(s), wait(700).then(() => jb.unload())]);
  await jb.load(s);
  camMode = 'home';
  await wait(500);
  await showTitle(songFace(s, role));
}

const vote = {
  el: $('#vote'), state: 'idle', cfg: null, rows: [], winner: null,
  prepare(s) {
    this.cfg = s; this.state = 'ready'; this.el.className = 'ready';
    this.el.querySelector('.vtitle').textContent = s.titel || 'Publikums-Voting';
    this.el.querySelector('.vq').textContent = s.frage || '';
    this.el.querySelector('.vs').textContent = 'Jetzt abstimmen!';
    this.el.querySelector('.vcount').textContent = '';
    const box = this.el.querySelector('.vrows'); box.innerHTML = '';
    this.rows = s.ergebnis.map((e, i) => {
      const song = SONGS.find(x => x.titel === e.titel) || {};
      const row = document.createElement('div'); row.className = 'vrow';
      row.style.setProperty('--c', song.color || LABEL_COLORS[i % 8]);
      row.innerHTML = `<div class="vcode"></div><div class="vname"><div class="vt"></div><div class="vc"></div></div>
        <div class="vbar"><div class="vfill"><span class="vpct">0 %</span></div></div>`;
      row.querySelector('.vcode').textContent = song.code || i + 1;
      row.querySelector('.vt').textContent = e.titel;
      row.querySelector('.vc').textContent = song.chor || song.solist || '';
      box.appendChild(row);
      return { row, fill: row.querySelector('.vfill'), pct: row.querySelector('.vpct'), fin: e.prozent, song, early: rand(.4, 1.6), ph: rand(0, 6.28), fr: rand(5, 11) };
    });
    box.style.gap = (this.rows.length > 6 ? 6 : 18) + 'px';
  },
  async run() {
    this.state = 'running'; this.el.className = 'running';
    this.el.querySelector('.vs').textContent = 'Abstimmung läuft …';
    const D = (this.cfg.dauer || 10) * 1000 * TEMPO, total = this.cfg.stimmen || 0;
    const max = Math.max(...this.rows.map(r => r.fin)), mean = 100 / this.rows.length;
    const scale = v => Math.min(100, v / (max * 1.3) * 100);
    const sstep = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
    await tween(D, t => {
      const grow = Math.min(1, t / .18), settle = sstep(.35, .92, t);
      let lead = null, lv = -1;
      for (const r of this.rows) {
        const early = r.early * mean, noise = Math.sin(t * r.fr * 6 + r.ph) * 4 * (1 - settle);
        let v = (early + (r.fin - early) * settle) * grow + noise * grow;
        if (t >= 1) v = r.fin;
        v = Math.max(0, v);
        r.fill.style.width = scale(v) + '%'; r.pct.textContent = Math.round(v) + ' %';
        if (v > lv) { lv = v; lead = r; }
      }
      this.rows.forEach(r => r.row.classList.toggle('lead', r === lead));
      if (total) this.el.querySelector('.vcount').textContent = Math.round(total * E.out(t)).toLocaleString('de-DE') + ' Stimmen';
    }, E.lin);
    this.state = 'done'; this.el.className = 'done';
    this.el.querySelector('.vs').textContent = 'Abstimmung beendet';
    const win = this.rows.reduce((a, b) => b.fin > a.fin ? b : a);
    this.winner = win.song && win.song.code ? win.song : null;
    this.rows.forEach(r => { r.row.classList.remove('lead'); r.row.classList.add(r === win ? 'win' : 'lose'); });
    sfx.fanfare(); confetti();
  },
  async playWinner() {
    this.state = 'played';
    setMode('main');
    if (!this.winner) { camMode = 'home'; return; }
    await playSong(this.winner, '★ Sieger');
    confetti();
  },
};

let idx = -1, busy = false, pending = 0, powered = false;
function setMode(m) { stage.className = 'mode-' + m; }
async function powerOn() {
  powered = true;
  $('#black').classList.add('gone');
  await wait(1200);
  await jb.power();
}
async function enter(s) {
  if (!powered) await powerOn();
  if (s.typ === 'lied') { setMode('main'); await playSong(s); }
  else if (s.typ === 'intro') {
    setMode('main'); camMode = 'home'; drawRacks(null); drawLed('– –');
    await jb.unload();
    await showTitle({ titel: s.titel, who: s.untertitel, code: '★' });
  } else if (s.typ === 'text') { setMode('text'); camMode = 'orbit'; showOverlay(s); await jb.unload(); }
  else if (s.typ === 'abstimmung') { vote.prepare(s); setMode('vote'); camMode = 'orbit'; await jb.unload(); }
}
async function run(fn) {
  busy = true; HURRY = false;
  try { await fn(); } catch (e) { console.error(e); }
  busy = false; HURRY = false;
  if (pending) { const d = pending; pending = 0; nav(d); }
}
function nav(dir) {
  sfx.init();
  if (!ready) return;
  if (busy) { HURRY = true; pending = dir; return; }
  const cur = PROGRAMM[idx];
  if (dir > 0 && cur && cur.typ === 'abstimmung') {
    if (vote.state === 'ready') return run(() => vote.run());
    if (vote.state === 'done') return run(() => vote.playWinner());
  }
  const n = idx + dir;
  if (n < 0 || n >= PROGRAMM.length) return;
  idx = n;
  run(() => enter(PROGRAMM[n]));
}
window.nav = nav; window.dbg = { J, jb, scene, renderer, bloom, spot, glowL, glowR, cavLight, camera, mWood, mChrome, bandMat, THREE, get idx() { return idx; }, set idx(v) { idx = v; }, get busy() { return busy; }, cam: m => camMode = m };

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.style.opacity = 1; clearTimeout(t._h); t._h = setTimeout(() => t.style.opacity = 0, 1400); }
addEventListener('keydown', e => {
  const k = e.key;
  if (['ArrowRight', ' ', 'PageDown', 'Enter', 'ArrowDown'].includes(k)) { e.preventDefault(); nav(1); }
  else if (['ArrowLeft', 'PageUp', 'Backspace', 'ArrowUp'].includes(k)) { e.preventDefault(); nav(-1); }
  else if (k === 'f' || k === 'F') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
  else if (k === 'm' || k === 'M') { sfx.on = !sfx.on; toast(sfx.on ? 'Ton an' : 'Ton aus'); }
  else if (k === 'h' || k === 'H') { const h = $('#help'); h.style.display = h.style.display === 'block' ? 'none' : 'block'; }
  else if (k === 'Home') location.reload();
});
const isTouch = matchMedia('(pointer: coarse)').matches;
let swiped = false, tx = 0, ty = 0;
addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; swiped = false; }, { passive: true });
addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) { swiped = true; nav(dx < 0 ? 1 : -1); }
});
addEventListener('click', e => {
  if (swiped) { swiped = false; return; }
  if (isTouch && !document.fullscreenElement && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
  nav(e.clientX < innerWidth * .25 ? -1 : 1);
});
addEventListener('contextmenu', e => { e.preventDefault(); nav(-1); });

let ready = true;
$('#black .hint').innerHTML = 'Tippen / Leertaste zum Starten<br>Weiter: Tippen, Wischen oder → · Zurück: linker Rand oder ←<br>F = Vollbild · H = Hilfe';
